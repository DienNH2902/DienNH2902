name: Generate Snake

on:
  # Tự động chạy lại sau mỗi 24 giờ
  schedule:
    - cron: "0 */24 * * *"
  
  # Cho phép bạn bấm chạy thủ công bất cứ lúc nào
  workflow_dispatch:
  
  # Tự chạy khi bạn update file README
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Tạo ảnh động con rắn từ đóng góp của tài khoản DienNH2902
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: DienNH2902
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23e67e22&color_dots=%23161b22,%23fed7aa,%23fb923c,%23ea580c,%239a3412          
      # Đẩy file ảnh đã sinh vào một nhánh phụ tên là `output`
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
